document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>The Elders Club — simple video guides for everyday technology<\u002Ftitle>\n<meta name=\"description\" content=\"Free step-by-step video guides that make phones and apps simple: pay bills, send money, order groceries, video call family. Plain language, one screen at a time.\">\n<meta property=\"og:title\" content=\"The Elders Club — simple video guides for everyday technology\">\n<meta property=\"og:description\" content=\"Free step-by-step guides that make phones and apps simple. Plain language, one screen at a time.\">\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:url\" content=\"https://theeldersclub.com\">\n<link rel=\"canonical\" href=\"https://theeldersclub.com\">\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@graph\": [\n    {\n      \"@type\": \"HowTo\",\n      \"name\": \"How to download and use Google Pay to send money safely\",\n      \"description\": \"A free, plain-language, step-by-step video and written guide that shows how to install Google Pay, link a bank account, set a UPI PIN, and send money by phone number, UPI ID, or QR code.\",\n      \"totalTime\": \"PT4M\",\n      \"step\": [\n        { \"@type\": \"HowToStep\", \"position\": 1, \"name\": \"Download Google Pay\", \"text\": \"Install Google Pay for free from the Play Store (Android) or App Store (iPhone).\" },\n        { \"@type\": \"HowToStep\", \"position\": 2, \"name\": \"Verify your phone number\", \"text\": \"Confirm the mobile number registered with your bank account by text message.\" },\n        { \"@type\": \"HowToStep\", \"position\": 3, \"name\": \"Link your bank account\", \"text\": \"Select your bank and Google Pay finds the account linked to your phone number automatically.\" },\n        { \"@type\": \"HowToStep\", \"position\": 4, \"name\": \"Set your UPI PIN\", \"text\": \"Create a 4 or 6 digit UPI PIN using your debit card details.\" },\n        { \"@type\": \"HowToStep\", \"position\": 5, \"name\": \"Send money by phone number or UPI ID\", \"text\": \"Enter the receiver's phone number or UPI ID and the amount to send.\" },\n        { \"@type\": \"HowToStep\", \"position\": 6, \"name\": \"Or scan a QR code\", \"text\": \"Scan a shop's or a family member's QR code to pay instantly.\" },\n        { \"@type\": \"HowToStep\", \"position\": 7, \"name\": \"Confirm with your UPI PIN\", \"text\": \"Enter your UPI PIN to complete the payment and receive a receipt.\" },\n        { \"@type\": \"HowToStep\", \"position\": 8, \"name\": \"Keep your PIN and OTP private\", \"text\": \"Never share your UPI PIN or one-time password with anyone, including callers claiming to be your bank.\" }\n      ]\n    },\n    {\n      \"@type\": \"FAQPage\",\n      \"mainEntity\": [\n        { \"@type\": \"Question\", \"name\": \"Is Google Pay safe to send money with?\", \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Yes. Every payment is approved with your UPI PIN, which is never stored on your phone or seen by Google or anyone else. The only way money can be taken from your account is if you say your PIN or an OTP out loud to someone, so never do that.\" } },\n        { \"@type\": \"Question\", \"name\": \"Does it cost anything to send money on Google Pay?\", \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"No. Sending money to a bank account through UPI on Google Pay is free, with no charge from Google or your bank.\" } },\n        { \"@type\": \"Question\", \"name\": \"How much money can I send in one day on Google Pay?\", \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Most banks allow up to ₹1,00,000 in UPI payments per day, across a maximum of 20 payments, though your own bank may set a lower limit.\" } },\n        { \"@type\": \"Question\", \"name\": \"Does the person I'm paying also need Google Pay?\", \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"No. Google Pay uses UPI, the same payment system every Indian bank supports, so you can pay anyone with a UPI ID or bank account, even on a different app.\" } },\n        { \"@type\": \"Question\", \"name\": \"What do I do if I send money to the wrong person on Google Pay?\", \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Contact that person straight away and ask them to send it back, then call your bank's helpline the same day to report a wrong transfer, since a completed UPI payment cannot be reversed automatically.\" } },\n        { \"@type\": \"Question\", \"name\": \"How do I reset a forgotten Google Pay UPI PIN?\", \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Open Google Pay, tap your bank account, choose \\\"Forgot UPI PIN,\\\" and set a new one using your debit card details.\" } }\n      ]\n    }\n  ]\n}\n<\u002Fscript>\n<script>document.documentElement.lang = \"en\";<\u002Fscript>\n<script src=\"35170b83-b91f-47d4-b26c-2d9547b5fec3\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>The Elders Club — simple video guides for everyday technology<\u002Ftitle>\n<meta name=\"description\" content=\"Free step-by-step video guides that make phones and apps simple: pay bills, send money, order groceries, video call family. Plain language, one screen at a time.\">\n<meta property=\"og:title\" content=\"The Elders Club — simple video guides for everyday technology\">\n<meta property=\"og:description\" content=\"Free step-by-step guides that make phones and apps simple. Plain language, one screen at a time.\">\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:url\" content=\"https://theeldersclub.com\">\n<link rel=\"canonical\" href=\"https://theeldersclub.com\">\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org\",\n  \"@graph\": [\n    {\n      \"@type\": \"HowTo\",\n      \"name\": edAnswer\": { \"@type\": \"Answer\", \"text\": \"Yes. Every payment is approved with your UPI PIN, which is never stored on your phone or seen by Google or anyone else. The only way money can be taken from your account is if you say your PIN or an OTP out loud to someone, so never do that.\" } },\n        { \"@type\": \"Question\", \"name\": \"Does it cost anything to send money on Google Pay?\", \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"No. Sending money to a bank account through UPI on Google Pay is free, with no charge from Google or your bank.\" } },\n        { \"@type\": \"Question\", \"name\": \"How much money can I send in one day on Google Pay?\", \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Most banks allow up to ₹1,00,000 in UPI payments per day, across a maximum of 20 payments, though your own bank may set a lower limit.\" } },\n        { \"@type\": \"Question\", \"name\": \"Does the person I'm paying also need Google Pay?\", \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"No. Google Pay uses UPI, the same payment system every Indian bank supports, so you can pay anyone with a UPI ID or bank account, even on a different app.\" } },\n        { \"@type\": \"Question\", \"name\": \"What do I do if I send money to the wrong person on Google Pay?\", \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Contact that person straight away and ask them to send it back, then call your bank's helpline the same day to report a wrong transfer, since a completed UPI payment cannot be reversed automatically.\" } },\n        { \"@type\": \"Question\", \"name\": \"How do I reset a forgotten Google Pay UPI PIN?\", \"acceptedAnswer\": { \"@type\": \"Answer\", \"text\": \"Open Google Pay, tap your bank account, choose \\\"Forgot UPI PIN,\\\" and set a new one using your debit card details.\" } }\n      ]\n    }\n  ]\n}\n<\u002Fscript>\n<script>document.documentElement.lang = \"en\";<\u002Fscript>\n\n<style>/* Modernist — design-system t divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75) free&quot;,&quot;Watch on YouTube&quot;],&quot;default&quot;:&quot;Subscribe on YouTube&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nconst GUIDES = [\n  { slug: \"gpay-send-money\", num: \"01\", app: \"Google Pay\", title: \"Download & use Google Pay: send money safely\", dur: \"3:32 min\", level: \"Begin here\", blurb: \"From download on Play Store and App Store to your first payment. UPI, QR codes, phone number payments, and how to never get scammed.\" },\n  { slug: \"gpay-bill\", num: \"02\", app: \"Google Pay\", title: \"Pay your electricity bill\", dur: \"7 min\", level: \"Begin here\", blurb: \"Set the bill up once. After that it takes two taps every month.\" },\n  { slug: \"whatsapp-video\", num: \"03\", app: \"WhatsApp\", title: \"Make a video call to your family\", dur: \"5 min\", level: \"Begin here\", blurb: \"See their faces, not just hear them — and fix it when the picture freezes.\" },\n  { slug: \"scams\", num: \"04\", app: \"Staying safe\", title: \"Spot a scam message before it costs you\", dur: \"8 min\", level: \"Important\", blurb: \"The four sentences a fraudster always uses, and the one rule that stops all of them.\" },\n  { slug: \"phone-type\", num: \"05\", app: \"Phone basics\", title: \"Know which phone you have and what it can do\", dur: \"6 min\", level: \"Begin here\", blurb: \"Every phone is a little different. Find out what yours is, so the rest of the guides fit it.\" },\n  { slug: \"groceries\", num: \"06\", app: \"BigBasket\", title: \"Order groceries to your door\", dur: \"8 min\", level: \"Everyday\", blurb: \"Build a list once, then reorder it every week without typing it again.\" },\n  { slug: \"gmail-attach\", num: \"07\", app: \"Gmail\", title: \"Send an email with a photo attached\", dur: \"6 min\", level: \"Everyday\", blurb: \"Including how to find that photo again once it's on your phone.\" },\n  { slug: \"uber\", num: \"08\", app: \"Uber\", title: \"Book a cab and know the fare beforehand\", dur: \"7 min\", level: \"Everyday\", blurb: \"Save your home address once so you never type it standing on a footpath.\" },\n  { slug: \"irctc\", num: \"09\", app: \"IRCTC\", title: \"Book a train ticket\", dur: \"8 min\", level: \"Going further\", blurb: \"Berth preference, senior citizen quota, and how to read the waiting list.\" },\n  { slug: \"ai\", num: \"10\", app: \"AI assistants\", title: \"Ask an AI assistant a question\", dur: \"7 min\", level: \"Going further\", blurb: \"The new thing everyone is talking about — what it is good for, and what not to trust it with.\" },\n  { slug: \"drive\", num: \"11\", app: \"Google Drive\", title: \"Keep documents where you cannot lose them\", dur: \"7 min\", level: \"Going further\", blurb: \"Aadhaar, PAN, medical reports — photographed once, found in seconds.\" },\n  { slug: \"maps\", num: \"12\", app: \"Google Maps\", title: \"Share where you are with your family\", dur: \"5 min\", level: \"Everyday\", blurb: \"So somebody always knows you reached, without a phone call.\" },\n  { slug: \"sheets\", num: \"13\", app: \"Google Sheets\", title: \"Keep a simple monthly expense sheet\", dur: \"8 min\", level: \"Going further\", blurb: \"Four columns and one total. No formulas to remember.\" },\n  { slug: \"youtube\", num: \"14\", app: \"YouTube\", title: \"Find videos you like and save them\", dur: \"6 min\", level: \"Everyday\", blurb: \"Bhajans, old films, recipes, and how to keep them all in one place.\" }\n];\n\nconst STEPS = [\n  { n: \"1\", title: \"Download Google Pay\", body: \"Open the Play Store on an Android phone, or the App Store on an iPhone. Type \\\"Google Pay\\\" into the search bar and tap Install. It is free, and the icon is a small coloured pinwheel.\", shot: \"App store listing for Google Pay\" },\n  { n: \"2\", title: \"Verify your phone number\", body: \"Open the app and enter the mobile number that is registered with your bank account — this must be the same SIM that is in your phone right now, since Google Pay confirms it with a text message.\", shot: \"Phone number verification screen\" },\n  { n: \"3\", title: \"Link your bank account\", body: \"Tap \\\"Add bank account\\\" and choose your bank from the list. Google Pay finds the account linked to that phone number by itself — you do not need to type your account number.\", shot: \"Bank account selection screen\" },\n  { n: \"4\", title: \"Set your UPI PIN\", body: \"Using the debit card for that account, choose a 4 or 6 digit UPI PIN. This is the number you will enter for every single payment — it is not the same as your ATM PIN or net banking password.\", shot: \"UPI PIN creation screen\" },\n  { n: \"5\", title: \"Send money with a phone number or UPI ID\", body: \"Tap \\\"Pay\\\", then type the receiver's phone number or their UPI ID (it looks like a name followed by @ and their bank, such as ravi@okhdfc). Check their name appears correctly before you continue.\", shot: \"Send money to a contact screen\" },\n  { n: \"6\", title: \"Or scan a QR code\", body: \"At a shop, or when a family member holds up their phone, tap the scan icon and point your camera at the code. Many shops fill in the amount automatically — always check it is correct before you pay.\", shot: \"Scanning a QR code to pay\" },\n  { n: \"7\", title: \"Enter your UPI PIN to finish\", body: \"Every payment — whether it is ₹10 or ₹90,000 — ends with your UPI PIN. The moment you enter it, the money moves and a receipt appears on your screen.\", shot: \"Payment confirmation with receipt\" },\n  { n: \"8\", title: \"Know what to never share\", body: \"Your UPI PIN and any OTP are for your eyes only. Your bank, Google, and The Elders Club will never call or message asking for either one — anyone who does is trying to take money from your account.\", shot: \"Reminder: never share your PIN or OTP\" }\n];\n\nconst FAQS = [\n  { q: \"Is Google Pay safe to send money with?\", a: \"Yes. Every payment is approved with your UPI PIN, which is never stored on your phone or seen by Google or anyone else. The only way money can be taken from your account is if you say your PIN or an OTP out loud to someone — so never do that, no matter who is asking.\" },\n  { q: \"Does it cost anything to send money on Google Pay?\", a: \"No. Sending money to a bank account through UPI on Google Pay is free, with no charge from Google or your bank, whether you send ₹10 or ₹90,000.\" },\n  { q: \"How much money can I send in one day?\", a: \"Most banks allow up to ₹1,00,000 in UPI payments per day, across a maximum of 20 payments — though your own bank may set a lower limit. If a payment is refused, try a smaller amount or wait until the next day.\" },\n  { q: \"Does the person I'm paying also need Google Pay?\", a: \"No. Google Pay uses UPI, the same payment system every Indian bank supports, so you can pay anyone with a UPI ID or bank account — even if they use a different app such as PhonePe or Paytm.\" },\n  { q: \"I sent money to the wrong person. What do I do?\", a: \"Contact that person straight away and ask them to send it back, then call your bank's helpline the same day to report a wrong transfer. A completed UPI payment cannot be reversed automatically, so acting quickly matters.\" },\n  { q: \"I forgot my UPI PIN. How do I reset it?\", a: \"Open Google Pay, tap your bank account, and choose \\\"Forgot UPI PIN.\\\" You'll set a new one using your debit card details, the same way as the first time — no branch visit or phone call needed.\" }\n];\n\nclass Component extends DCLogic {\n  state = { route: \"home\", slug: \"gpay-send-money\", playing: false };\n\n  go(route, slug) {\n    return (e) => {\n      if (e && e.preventDefault) e.preventDefault();\n      this.setState({ route, slug: slug || this.state.slug, playing: false });\n      if (typeof window !== \"undefined\") window.scrollTo(0, 0);\n    };\n  }\n\n  goYouTube(e) {\n    if (e && e.preventDefault) e.preventDefault();\n    window.open(\"https://www.youtube.com/@theeldersclubhq\", \"_blank\");\n  }\n\n  mailFrom(e, subject, bodyFor) {\n    if (e && e.preventDefault) e.preventDefault();\n    const wrap = e.currentTarget.parentNode;\n    const input = wrap ? wrap.querySelector(\"input\") : null;\n    const val = input && input.value ? input.value.trim() : \"\";\n    if (input && !val) { input.focus(); return; }\n    window.location.href = \"mailto:contact@theeldersclub.com?subject=\" +\n      encodeURIComponent(subject) + \"&body=\" + encodeURIComponent(bodyFor(val));\n    if (input) input.value = \"\";\n  }\n\n  facade(playing, onPlay) {\n    const R = React.createElement;\n    if (playing) {\n      return R(\"div\", { style: { border: \"2px solid #1f3a4d\", background: \"#1f3a4d\", color: \"#fdf9f2\", aspectRatio: \"16 / 9\", display: \"flex\", flexDirection: \"column\", alignItems: \"center\", justifyContent: \"center\", gap: \"12px\", padding: \"24px\", textAlign: \"center\" } },\n        R(\"div\", { style: { fontWeight: 800, fontSize: \"26px\", letterSpacing: \"-0.01em\" } }, \"The YouTube player loads here\"),\n        R(\"div\", { style: { fontSize: \"18px\", maxWidth: \"46ch\", lineHeight: 1.5, color: \"#c9d6de\" } }, \"Only now — on the click — does the browser fetch anything from youtube.com. Before this, the page carried one image and nothing more.\")\n      );\n    }\n    return R(\"button\", {\n      onClick: onPlay,\n      \"aria-label\": \"Play the video\",\n      style: { position: \"relative\", width: \"100%\", aspectRatio: \"16 / 9\", border: \"2px solid #1f3a4d\", background: \"#e6dcc9\", cursor: \"pointer\", padding: 0, display: \"flex\", alignItems: \"flex-end\" }\n    },\n      R(\"div\", { style: { position: \"absolute\", inset: 0, display: \"flex\", alignItems: \"center\", justifyContent: \"center\" } },\n        R(\"div\", { style: { width: \"112px\", height: \"78px\", background: \"#c9973a\", border: \"2px solid #1f3a4d\", display: \"flex\", alignItems: \"center\", justifyContent: \"center\" } },\n          R(\"svg\", { width: \"36\", height: \"36\", viewBox: \"0 0 24 24\", \"aria-hidden\": \"true\" }, R(\"path\", { d: \"M6 4 L20 12 L6 20 Z\", fill: \"#1f3a4d\" }))\n        )\n      ),\n      R(\"div\", { style: { position: \"relative\", padding: \"18px 20px\", fontSize: \"15px\", fontWeight: 700, letterSpacing: \"0.1em\", textTransform: \"uppercase\", color: \"#3d5c70\", textAlign: \"left\" } }, \"Video thumbnail — one image, 40 KB\")\n    );\n  }\n\n  renderVals() {\n    const { route, slug, playing } = this.state;\n    const guides = GUIDES.map((g) => {\n      const live = g.slug === \"gpay-send-money\";\n      return Object.assign({}, g, {\n        track: g.level,\n        live,\n        level: live ? \"Watch here\" : \"Coming soon\",\n        meta: live ? g.dur + \" · Watch here\" : \"Coming soon · \" + g.dur,\n        open: this.go(\"guide\", g.slug)\n      });\n    });\n    const current = guides.find((g) => g.slug === slug) || guides[0];\n\n    return {\n      guides,\n      liveGuides: guides.filter((g) => g.live),\n      comingGuides: guides.filter((g) => !g.live),\n      comingCount: guides.filter((g) => !g.live).length,\n      starters: guides.filter((g) => g.track === \"Begin here\").slice(0, 3),\n      nextUp: guides.filter((g) => !g.live && g.slug !== current.slug).slice(0, 3),\n      guideCount: GUIDES.length,\n      guide: Object.assign({}, current, {\n        outcomes: current.slug === \"gpay-send-money\" ? [\n          \"Download Google Pay on your phone\",\n          \"Send money using UPI or phone number\",\n          \"Scan a QR code to make a payment\",\n          \"Know what never to share with anyone\"\n        ] : [],\n        videoId: current.slug === \"gpay-send-money\" ? \"gcLZDoODEZE\" : null\n      }),\n      hasBody: current.slug === \"gpay-send-money\",\n      noBody: current.slug !== \"gpay-send-money\",\n      steps: STEPS,\n      faqs: FAQS,\n      filters: [\"Everything\", \"Money\", \"Family & talking\", \"Shopping\", \"Phone basics\", \"Staying safe\"],\n      promises: [\n        { big: \"Nothing skipped\", small: \"Every single tap is shown on screen\" },\n        { big: \"Plain language\", small: \"No jargon, no rushing, no assumptions\" },\n        { big: \"Always free\", small: \"Watch as often as you like\" }\n      ],\n      pillars: [\n        { n: \"01\", title: \"One screen, one step\", body: \"Every tap is shown. Nothing is called obvious.\" },\n        { n: \"02\", title: \"A hand holding a phone\", body: \"Filmed the way you actually hold it, not a flat recording.\" },\n        { n: \"03\", title: \"Written steps for every video\", body: \"Read them, print them, keep them beside you.\" },\n        { n: \"04\", title: \"Ask, and we answer\", body: \"Your questions decide what gets made next.\" }\n      ],\n      voices: [\n        { quote: \"I paid my own bill for the first time in four years. My son found out afterwards.\", who: \"Member, Pune\" },\n        { quote: \"I use a wheelchair, so the shopping was always somebody else's errand. Last Tuesday I ordered the whole month's provisions myself — and found a discount my daughter-in-law had missed.\", who: \"Member, Kochi\" }\n      ],\n      principles: [\n        { title: \"No jargon, ever\", body: \"If a word needs explaining, we use a different word. 'Tap the three dots', not 'access the overflow menu'.\" },\n        { title: \"Nothing is sold to you\", body: \"Free to watch, free to read, and your details are never passed on to anyone.\" },\n        { title: \"Safety in every guide\", body: \"Every money guide repeats the same rule: your PIN and OTP are never spoken aloud to anyone, ever.\" }\n      ],\n      ctaLabel: this.props.ctaLabel ?? \"Subscribe on YouTube\",\n      isHome: route === \"home\",\n      isGuides: route === \"guides\",\n      isGuide: route === \"guide\",\n      isAbout: route === \"about\",\n      player: this.facade(playing, () => this.setState({ playing: true })),\n      joinClub: (e) => this.mailFrom(e, \"Please add me to The Elders Club\",\n        (v) => \"Hello,\\n\\nPlease add me to the club so I get each new guide by email.\\n\\nMy email address: \" + v + \"\\n\\nThank you.\"),\n      joinWhatsApp: (e) => this.mailFrom(e, \"Add me to The Elders Club WhatsApp group\",\n        (v) => \"Hello,\\n\\nPlease add this WhatsApp number to The Elders Club group:\\n\\n\" + v + \"\\n\\nThank you.\"),\n      askUs: (e) => this.mailFrom(e, \"A question for The Elders Club\",\n        (v) => \"Hello,\\n\\nI am stuck on this:\\n\\n\" + v + \"\\n\\nCould you make a guide for it?\\n\\nThank you.\"),\n      goHome: this.go(\"home\"),\n      goGuides: this.go(\"guides\"),\n      goAbout: this.go(\"about\"),\n      goYouTube: this.goYouTube.bind(this)\n    };\n  }\n}\n\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
